name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Same base as .devcontainer: older glibc/libstdc++ keeps the .so loadable on older servers
    container: ubuntu:20.04
    steps:
      - name: Install toolchain
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gcc g++ gcc-multilib g++-multilib git make ca-certificates curl python3

      - uses: actions/checkout@v4

      - name: Fetch SDKs
        run: |
          mkdir -p /sdk
          git clone --depth 1 -b episode1 https://github.com/alliedmodders/hl2sdk /sdk/hl2sdk-episode1
          git clone --depth 1 -b css https://github.com/alliedmodders/hl2sdk /sdk/hl2sdk-css
          git clone --depth 1 -b 1.6-dev https://github.com/alliedmodders/sourcemod /sdk/sourcemod
          git clone --depth 1 -b 1.10-dev https://github.com/alliedmodders/metamod-source /sdk/mmsource

      # SourceMod 1.13 refuses extensions older than API 9, so CS:S v34 servers on it need their own build.
      # Same SourceMod tree as the current fmu1337/sourcemod-css34 sm13-latest release: pinned commit plus its
      # patch series. The release comes from the line-sm13-latest pointer's lines.json (its git tag is not moved).
      - name: Fetch SourceMod 1.13 (CS:S v34)
        env:
          SM113_LINE: sm13-latest
        run: |
          curl -fsSL -o /sdk/sm113-lines.json "https://github.com/fmu1337/sourcemod-css34/releases/download/line-$SM113_LINE/lines.json"
          line() { python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))[sys.argv[2]][sys.argv[3]])' /sdk/sm113-lines.json "$SM113_LINE" "$1"; }
          RELEASE=$(line tag)
          echo "line-$SM113_LINE -> $RELEASE (SourceMod $(line sm_version) $(line sm_commit), API $(line extension_api_min)..$(line extension_api))"
          { echo "SM113_API_MIN=$(line extension_api_min)"; echo "SM113_API_MAX=$(line extension_api)"; } >> "$GITHUB_ENV"
          git clone --depth 1 -b "$RELEASE" https://github.com/fmu1337/sourcemod-css34 /sdk/sourcemod-css34
          SERIES=/sdk/sourcemod-css34/builder/patches/series/$SM113_LINE
          COMMIT=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["commit"])' "$SERIES/series.json")
          test "$COMMIT" = "$(line sm_commit)"
          bash /sdk/sourcemod-css34/builder/fetch-sourcemod.sh /sdk/sourcemod-1.13 "$COMMIT"
          bash /sdk/sourcemod-css34/builder/patches/apply-series.sh "$SERIES" /sdk/sourcemod-1.13
          grep -E 'define SMINTERFACE_EXTENSIONAPI_VERSION' /sdk/sourcemod-1.13/public/IExtensionSys.h

      - name: Build
        run: |
          mkdir -p dist
          for ENGINE in css34 css; do
            make ENGINE=$ENGINE SMSDK=/sdk/sourcemod MMSOURCE110=/sdk/mmsource \
              HL2SDK_ORIG=/sdk/hl2sdk-episode1 HL2SDK_CSS=/sdk/hl2sdk-css \
              PCMDS_REPOSITORY="$GITHUB_REPOSITORY" -j$(nproc)
            cp Release.$ENGINE/protectcmds.ext.so dist/protectcmds.$ENGINE.ext.so
          done
          for ENGINE in css34 css; do
            make ENGINE=$ENGINE SMLINE=sm113 SMSDK=/sdk/sourcemod-1.13 MMSOURCE110=/sdk/mmsource \
              HL2SDK_ORIG=/sdk/hl2sdk-episode1 HL2SDK_CSS=/sdk/hl2sdk-css \
              PCMDS_REPOSITORY="$GITHUB_REPOSITORY" -j$(nproc)
            cp Release.$ENGINE.sm113/protectcmds.ext.so dist/protectcmds.$ENGINE.sm113.ext.so
          done
          cd dist
          for f in *.so; do sha256sum "$f" > "$f.sha256"; done
          ls -la
          cat *.sha256

      # Extension API each build reports to SourceMod, and SteamID hashing identical to the v1.1.1 release
      - name: Verify
        shell: bash
        env:
          BASELINE_TAG: v1.1.1
          BASELINE_SHA256_css34: 865de8bc813e0e17a3f94bd46b0da9d77c162763d86c5597f72d02585e87b15f
          BASELINE_SHA256_css: 43b86ed75ec99185589da1f0e57ecd49881d1ed4d71247c429adfd791fe9c5a3
        run: |
          set -e
          mkdir -p /tmp/verify
          g++ -m32 -O2 -Wall -o /tmp/verify/hashcheck tests/hashcheck.cpp -ldl
          api() { /tmp/verify/hashcheck "$1" --api; }

          for ENGINE in css34 css; do
            if [ $ENGINE = css34 ]; then export LD_LIBRARY_PATH=/sdk/hl2sdk-episode1/linux_sdk
            else export LD_LIBRARY_PATH=/sdk/hl2sdk-css/lib/public/linux; fi
            baseline=/tmp/verify/baseline.$ENGINE.so
            sha=BASELINE_SHA256_$ENGINE
            curl -fsSL -o $baseline \
              "https://github.com/fmu1337/ProtectCMDS/releases/download/$BASELINE_TAG/protectcmds.$ENGINE.ext.so"
            echo "${!sha}  $baseline" | sha256sum -c -

            echo "API $ENGINE: baseline $(api $baseline), build $(api dist/protectcmds.$ENGINE.ext.so), sm113 $(api dist/protectcmds.$ENGINE.sm113.ext.so)"
            test "$(api dist/protectcmds.$ENGINE.ext.so)" = 7
            API=$(api dist/protectcmds.$ENGINE.sm113.ext.so)
            test "$API" -ge "$SM113_API_MIN" && test "$API" -le "$SM113_API_MAX"

            /tmp/verify/hashcheck $baseline > /tmp/verify/baseline.$ENGINE.txt
            for so in protectcmds.$ENGINE.ext.so protectcmds.$ENGINE.sm113.ext.so; do
              /tmp/verify/hashcheck "dist/$so" > "/tmp/verify/$so.txt"
              cmp /tmp/verify/baseline.$ENGINE.txt "/tmp/verify/$so.txt"
              echo "$so: $(grep -vc '^salt' "/tmp/verify/$so.txt") hashes identical to $BASELINE_TAG"
            done
          done
          sha256sum /tmp/verify/*.txt

      # The updater must never write into the loaded .so: <file>.new, sha256, rename(), <file>.prev
      - name: Updater file swap
        run: |
          g++ -m32 -O2 -Wall -I. -o /tmp/fileswap_test tests/fileswap_test.cpp updater/fileswap.cpp helpers/sha256.cpp -ldl
          mkdir -p /tmp/fileswap
          LD_LIBRARY_PATH=/sdk/hl2sdk-episode1/linux_sdk /tmp/fileswap_test \
            dist/protectcmds.css34.ext.so dist/protectcmds.css34.sm113.ext.so /tmp/fileswap

      # protectcmds.inc must compile against the natives and forwards above (spcomp of the SM 1.13 package)
      - name: Check include
        run: |
          mkdir -p /tmp/spcomp && cd /tmp/spcomp
          base=https://github.com/fmu1337/sourcemod-css34/releases/download/line-sm13-latest
          curl -fsSLO "$base/sourcemod-css34-linux.tar.gz" -O "$base/SHA256SUMS"
          grep ' sourcemod-css34-linux.tar.gz$' SHA256SUMS | sha256sum -c -
          tar -xzf sourcemod-css34-linux.tar.gz addons/sourcemod/scripting
          SPCOMP=addons/sourcemod/scripting/spcomp64
          [ -x "$SPCOMP" ] || SPCOMP=addons/sourcemod/scripting/spcomp
          "$SPCOMP" "$GITHUB_WORKSPACE/tests/inc_test.sp" -i addons/sourcemod/scripting/include -i "$GITHUB_WORKSPACE/package/addons/sourcemod/scripting/include" -o /tmp/spcomp/inc_test.smx -E

      # Ready-to-unpack archives for server owners: the .so with its configs, laid out as in cstrike/
      - name: Package
        run: |
          for build in css34 css34.sm113 css css.sm113; do
            name=protectcmds-$(echo "$build" | tr . -)
            mkdir -p "/tmp/pkg/$name"
            cp -r package/addons "/tmp/pkg/$name/"
            cp "dist/protectcmds.$build.ext.so" "/tmp/pkg/$name/addons/sourcemod/extensions/protectcmds.ext.so"
            (cd "/tmp/pkg/$name" && python3 -m zipfile -c "$GITHUB_WORKSPACE/dist/$name.zip" addons)
          done
          python3 -m zipfile -l dist/protectcmds-css34-sm113.zip

      - uses: actions/upload-artifact@v4
        with:
          name: protectcmds
          path: dist/

  release:
    needs: build
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: protectcmds
          path: dist

      # Stable channel: updater uses releases/latest/download/...
      - name: Stable release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes

      # Experimental channel: updater uses releases/download/experimental/...
      - name: Experimental release
        if: github.ref == 'refs/heads/master'
        run: |
          gh release delete experimental --cleanup-tag --yes || true
          gh release create experimental dist/* --prerelease --target "$GITHUB_SHA" \
            --title "Experimental" --notes "Automatic build of $GITHUB_SHA"
