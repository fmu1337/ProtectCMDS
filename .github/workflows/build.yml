name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Same base as .devcontainer: older glibc/libstdc++ keeps the .so loadable on older servers
    container: ubuntu:20.04
    steps:
      - name: Install toolchain
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gcc g++ gcc-multilib g++-multilib git make ca-certificates curl python3

      - uses: actions/checkout@v4

      - name: Fetch SDKs
        run: |
          mkdir -p /sdk
          git clone --depth 1 -b episode1 https://github.com/alliedmodders/hl2sdk /sdk/hl2sdk-episode1
          git clone --depth 1 -b css https://github.com/alliedmodders/hl2sdk /sdk/hl2sdk-css
          git clone --depth 1 -b 1.6-dev https://github.com/alliedmodders/sourcemod /sdk/sourcemod
          git clone --depth 1 -b 1.10-dev https://github.com/alliedmodders/metamod-source /sdk/mmsource

      # SourceMod 1.13 refuses extensions older than API 9, so CS:S v34 servers on it need their own build.
      # Same SourceMod tree as the fmu1337/sourcemod-css34 release: pinned commit plus its patch series.
      - name: Fetch SourceMod 1.13 (CS:S v34)
        env:
          SM113_RELEASE: 1.13.0.7478-mm1.12.0-r3
        run: |
          git clone --depth 1 -b "$SM113_RELEASE" https://github.com/fmu1337/sourcemod-css34 /sdk/sourcemod-css34
          SERIES=/sdk/sourcemod-css34/builder/patches/series/sm13-latest
          COMMIT=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["commit"])' "$SERIES/series.json")
          bash /sdk/sourcemod-css34/builder/fetch-sourcemod.sh /sdk/sourcemod-1.13 "$COMMIT"
          bash /sdk/sourcemod-css34/builder/patches/apply-series.sh "$SERIES" /sdk/sourcemod-1.13
          grep -E 'define SMINTERFACE_EXTENSIONAPI_VERSION' /sdk/sourcemod-1.13/public/IExtensionSys.h

      - name: Build
        run: |
          mkdir -p dist
          for ENGINE in css34 css; do
            make ENGINE=$ENGINE SMSDK=/sdk/sourcemod MMSOURCE110=/sdk/mmsource \
              HL2SDK_ORIG=/sdk/hl2sdk-episode1 HL2SDK_CSS=/sdk/hl2sdk-css \
              PCMDS_REPOSITORY="$GITHUB_REPOSITORY" -j$(nproc)
            cp Release.$ENGINE/protectcmds.ext.so dist/protectcmds.$ENGINE.ext.so
          done
          make ENGINE=css34 SMLINE=sm113 SMSDK=/sdk/sourcemod-1.13 MMSOURCE110=/sdk/mmsource \
            HL2SDK_ORIG=/sdk/hl2sdk-episode1 PCMDS_REPOSITORY="$GITHUB_REPOSITORY" -j$(nproc)
          cp Release.css34.sm113/protectcmds.ext.so dist/protectcmds.css34.sm113.ext.so
          cd dist
          for f in *.so; do sha256sum "$f" > "$f.sha256"; done
          ls -la
          cat *.sha256

      # Extension API each build reports to SourceMod, and SteamID hashing identical to the v1.1.1 release
      - name: Verify
        env:
          BASELINE_TAG: v1.1.1
          BASELINE_SHA256: 865de8bc813e0e17a3f94bd46b0da9d77c162763d86c5597f72d02585e87b15f
        run: |
          mkdir -p /tmp/verify
          curl -fsSL -o /tmp/verify/baseline.so \
            "https://github.com/fmu1337/ProtectCMDS/releases/download/$BASELINE_TAG/protectcmds.css34.ext.so"
          echo "$BASELINE_SHA256  /tmp/verify/baseline.so" | sha256sum -c -
          g++ -m32 -O2 -Wall -o /tmp/verify/hashcheck tests/hashcheck.cpp -ldl
          export LD_LIBRARY_PATH=/sdk/hl2sdk-episode1/linux_sdk

          api() { /tmp/verify/hashcheck "$1" --api; }
          echo "API: baseline $(api /tmp/verify/baseline.so), css34 $(api dist/protectcmds.css34.ext.so), css34.sm113 $(api dist/protectcmds.css34.sm113.ext.so)"
          test "$(api dist/protectcmds.css34.ext.so)" = 7
          API=$(api dist/protectcmds.css34.sm113.ext.so)
          test "$API" -ge 9 && test "$API" -le 11

          /tmp/verify/hashcheck /tmp/verify/baseline.so > /tmp/verify/baseline.txt
          for so in protectcmds.css34.ext.so protectcmds.css34.sm113.ext.so; do
            /tmp/verify/hashcheck "dist/$so" > "/tmp/verify/$so.txt"
            cmp /tmp/verify/baseline.txt "/tmp/verify/$so.txt"
            echo "$so: $(grep -vc '^salt' "/tmp/verify/$so.txt") hashes identical to $BASELINE_TAG"
          done
          sha256sum /tmp/verify/*.txt

      - uses: actions/upload-artifact@v4
        with:
          name: protectcmds
          path: dist/

  release:
    needs: build
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: protectcmds
          path: dist

      # Stable channel: updater uses releases/latest/download/...
      - name: Stable release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes

      # Experimental channel: updater uses releases/download/experimental/...
      - name: Experimental release
        if: github.ref == 'refs/heads/master'
        run: |
          gh release delete experimental --cleanup-tag --yes || true
          gh release create experimental dist/* --prerelease --target "$GITHUB_SHA" \
            --title "Experimental" --notes "Automatic build of $GITHUB_SHA"
