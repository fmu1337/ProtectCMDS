; ********************************** ProtectCMDS **********************************
[ProtectCMDS]
;Включить ProtectCMDS (без этого файла или при 0 расширение не загружается)
; 1 - Включен | 0 - Выключен
protectcmds_enable=1

[BlockCmds]
; *** Модуль блокировки команд BlockCmds (список - blockcmds.txt) ***
; 1 - Включен | 0 - Выключен
blockcmds_enable=1
; Максимальное количество команд в секунду, при превышении игрока кикает
blockcmds_maxcommands=30

[SteamIDHashing]
; *** Модуль хеширования SteamID ***
; Соль создается при первом запуске с включенным хешированием: data/protectcmds/protectcmds_steamid_salt.dat
; Чтобы SteamID совпадали на нескольких серверах, скопируйте этот файл на все сервера.
; Включение/выключение меняет SteamID всех игроков (админы, баны, статистика) - см. README.
; 1 - Включен | 0 - Выключен
steamidhashing_enable=0

[OSFix]
; *** Модуль фиксации ОС буфера (только на новых ОС Debian 10+ and Ubuntu 18+) ***
; 1 - Включен | 0 - Выключен
osfix_enable=0

[FilterPacket]
; *** Модуль низкоуровневого обработки сетевых пакетов (Защита от DoS атак и кривых пакетов) ***
; 1 - Включен | 0 - Выключен
filterpacket_enable=1
; Статистика по IP пакетов, которые фильтр исправляет или отбрасывает: пустые UDP-пакеты (как dosprotect),
; split-пакеты (v34) и connectionless-флуд. Просмотр: sm protectcmds packets, очистка: sm protectcmds packets reset
; 1 - Включена | 0 - Выключена
filterpacket_stats=1
; Запись в лог SourceMod, когда с одного IP (или всего) пришло столько таких пакетов за filterpacket_stats_log_interval секунд.
; Без атаки таких пакетов нет, лог пустой. 0 - не писать
filterpacket_stats_log_threshold=100
filterpacket_stats_log_interval=10
; (только v34) Ограничение connectionless-пакетов (запросы сервера, challenge, connect) с одного IP в секунду, лишние отбрасываются.
; Игрок, который уже на сервере, их почти не шлет. 0 - без ограничения. Если включать, то с запасом, например 300
filterpacket_connectionless_limit=0

[GameStats]
; *** Модуль GameStats ***
; 1 - Включен | 0 - Выключен
gamestats_enable=1

[GamePacketFix]
; *** Модуль обработки кривых игровых пакетов от игроков и блокировка флуда кривыми пакетами ***
; 1 - Включен | 0 - Выключен
gamepacketfix_enable=1

[Updater]
;Включить автообновление? Проверка идет при загрузке расширения (старт сервера).
;Новая версия скачивается поверх extensions/protectcmds.ext.so и работает после следующего рестарта.
;Обновляется только .so, этот конфиг не трогается.
; 1 - Да | 0 - Нет
protectcmds_updater_enable = 1

;Репозиторий GitHub (владелец/имя), из релизов которого берутся обновления
protectcmds_updater_repository = fmu1337/ProtectCMDS

;Получать экспериментальные обновления (автосборки master, релиз "experimental")?
;Новые фишки, обновление ошибок. Возможны ошибки в экспериментальной версии
protectcmds_updater_experimental = 0

[VACPatch]
; *** Модуль фикса значка VAC (Valve Anti Cheat) ***
; 1 - Включен | 0 - Выключен
vacpatch_enable=1

; ********************************** ProtectCMDS **********************************
